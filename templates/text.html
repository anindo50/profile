<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Style Response</title>
    <style>
        /* Basic reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f7fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Smooth fade-in effect */
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* Form styling */
        form {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        form input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
            transition: all 0.3s;
        }

        form input[type="text"]:focus {
            border-color: #00bcd4;
            outline: none;
        }

        form input[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #00bcd4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        form input[type="submit"]:hover {
            background-color: #00796b;
        }

        /* Chat bubble styling */
        .chat-bubble {
            background-color: #00bcd4;
            color: #fff;
            padding: 18px;
            border-radius: 20px;
            max-width: 80%;
            font-size: 16px;
            line-height: 1.5;
            position: relative;
            animation: slideIn 0.5s ease-in-out;
        }

        /* Add a "tail" on the chat bubble */
        .chat-bubble::after {
            content: '';
            position: absolute;
            top: 12px;
            left: -12px;
            width: 12px;
            height: 12px;
            background-color: #00bcd4;
            transform: rotate(45deg);
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.1);
            border-radius: 2px;
        }

        /* Smooth sliding animation for chat bubbles */
        @keyframes slideIn {
            0% {
                transform: translateX(-50px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .chat-container {
                max-height: 400px;
                padding: 15px;
            }

            form {
                padding: 10px;
            }

            form input[type="submit"] {
                font-size: 14px;
                padding: 12px;
            }

            form input[type="text"] {
                font-size: 14px;
                padding: 10px;
            }
        }

        .navbar {
            background-color: #6e33ff;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .navbar .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            display: inline-block;
        }
        .navbar a:hover {
            background-color: #f30b0b;
            border-radius: 5px;
        }
        .content {
            padding: 20px;
            text-align: center;
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div>
            <a href="/">Home</a>
            <a href="/file">Pdf to txt</a>
            <a href="/ocr">Pdf to word with ocr</a>
            <a href="/voice">Text to voice</a>
        </div>
    </div>
    <br>
    <!-- Chat container to hold the generated response -->
    <div class="chat-container">
        {% if gen %}
            <div class="chat-bubble">
                {{ gen }}
            </div>
        {% endif %}
    </div>

    <!-- Chat input form -->
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="text" placeholder="Type your message..." required>
        <input type="submit" name="submit" value="Send" id="submit-btn" disabled>
    </form>
</body>
</html>
